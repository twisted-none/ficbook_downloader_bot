services:
  ficbook-bot:
    build: .
    container_name: ficbook-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      TEST_BOT_TOKEN: ""
      DATABASE_URL: ${DATABASE_URL}
      METRICS_HOST: ${METRICS_HOST:-0.0.0.0}
      METRICS_PORT: ${METRICS_PORT:-8000}
    ports:
      - "${METRICS_HOST_PORT:-18000}:${METRICS_PORT:-8000}"
    volumes:
      - ficbook-bot-data:/app/data

volumes:
  ficbook-bot-data:
